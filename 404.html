    .vignette{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%);
    }
    main{
      position:relative;
      z-index:2;
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:max(2.2rem, env(safe-area-inset-top)) 1.4rem max(2.2rem, env(safe-area-inset-bottom));
    }
    h1{
      margin:0;
      font-family:"Cinzel Decorative", serif;
      font-weight:700;
      font-size:clamp(1.55rem, 2.4vw + 1.1rem, 3.05rem);
      line-height:1.18;
      letter-spacing:.16em;
      color:var(--bone);
      text-shadow:0 1px 1px rgba(0,0,0,.85), 0 0 28px rgba(210,180,122,.12);
    }
    h1 span{display:block}
    .rule{
      display:block;
      width:min(7.5rem, 36vw);
      height:1px;
      margin:1.15rem 0 1.45rem;
      border:0;
      background:linear-gradient(90deg, transparent, var(--gold) 18%, var(--gold-hi) 50%, var(--gold) 82%, transparent);
      opacity:.85;
    }
    .seal{
      width:min(15.5rem, 62vw);
      height:auto;
      margin:0 0 1.35rem;
      filter:drop-shadow(0 10px 16px rgba(0,0,0,.72)) drop-shadow(0 0 28px rgba(125,16,20,.28));
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      pointer-events:none;
    }
    p{
      margin:0;
      max-width:22rem;
      font-size:clamp(1.02rem, .4vw + .95rem, 1.22rem);
      line-height:1.45;
      letter-spacing:.08em;
      color:var(--muted);
      text-shadow:0 1px 2px rgba(0,0,0,.8);
    }
    @media (prefers-reduced-motion: no-preference){
      .seal{animation:rest 7s ease-in-out infinite}
    }
    @keyframes rest{
      0%,100%{filter:drop-shadow(0 10px 16px rgba(0,0,0,.72)) drop-shadow(0 0 24px rgba(125,16,20,.22))}
      50%{filter:drop-shadow(0 10px 16px rgba(0,0,0,.72)) drop-shadow(0 0 36px rgba(179,25,31,.38))}
    }
  </style>
